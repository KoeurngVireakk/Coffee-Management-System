name: Feature proposal
description: Propose a scoped feature for the team.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: User need and scope
      description: Describe the user, task, and intended outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior and any API, schema, or access requirements.
    validations:
      required: true
